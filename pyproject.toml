[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hip3-oracle"
version = "0.1.0"
description = "Fail-closed multi-source oracle pipeline for Hyperliquid HIP-3 perpetual markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HIP-3 Oracle Contributors" }]
keywords = ["hyperliquid", "hip-3", "oracle", "perpetuals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
live = ["hyperliquid-python-sdk>=0.19.0,<1"]
dev = ["build>=1.2", "ruff>=0.6"]

[project.scripts]
hip3-oracle = "hip3_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
