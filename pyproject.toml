[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hip3-oracle"
version = "0.2.0"
description = "Fail-closed multi-source oracle pipeline for Hyperliquid HIP-3 perpetual markets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HIP-3 Oracle Contributors" }]
keywords = ["hyperliquid", "hip-3", "oracle", "perpetuals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
live = ["hyperliquid-python-sdk==0.24.0"]
dev = ["build>=1.2", "ruff==0.16.10"]

[project.scripts]
hip3-oracle = "hip3_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
