name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install '.[dev,live]'
      - name: Lint and formatting
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python -m build
      - name: Validate templates
        run: |
          hip3-oracle --config config/example.json validate
          hip3-oracle --config config/testnet.example.json validate

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t hip3-oracle:ci .
      - name: Offline non-root smoke test
        run: docker run --rm --network none hip3-oracle:ci --config /app/config/example.json once
